[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "saiverse"
dynamic = ["version"]
description = "Multi-agent AI system where autonomous AI personas inhabit a virtual world"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
authors = [
    { name = "maha0525" },
]
keywords = ["ai", "multi-agent", "llm", "autonomous-agents", "virtual-world"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/maha0525/SAIVerse"
Repository = "https://github.com/maha0525/SAIVerse"
Issues = "https://github.com/maha0525/SAIVerse/issues"

# Tool configs (merged from discord_gateway/pyproject.toml)
[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501", "UP017"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# --ignore=temp: temp/ holds gitignored vendored third-party code (e.g. the
# LVGL test suite under stackchan-mcp firmware) whose test files run real
# build steps / call sys.exit() at import, which aborts the whole pytest
# session with INTERNALERROR during collection. Never collect it.
# --ignore=test_data: test_data/ is the isolated test environment's runtime
# data (DBs, logs, caches), never test code. Collection walking it can abort
# the whole session on an unreadable leftover directory (permission-locked
# scratch dirs from crashed runs).
# -n auto --dist worksteal: run tests in parallel via pytest-xdist (full suite
# 11m44s -> 2m11s on 24 logical CPUs, measured 2026-08-16). worksteal rebalances
# uneven test durations across workers. For a single-file / targeted run the
# worker startup (each re-imports the app, ~15s) outweighs the gain — pass
# `-n 0` to run in-process instead.
addopts = "-ra --ignore=temp --ignore=test_data -n auto --dist worksteal"

[tool.setuptools]
packages = ["saiverse"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }
